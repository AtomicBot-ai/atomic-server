name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # `release.yml` runs these same gates before it builds anything.
  workflow_call:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm run build
      - run: node scripts/gen-command-docs.mjs --check
      - run: node scripts/gen-third-party-notices.mjs --check

  # The installers and the workflows are code too: shellcheck, PSScriptAnalyzer, actionlint.
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: shellcheck --shell=sh scripts/install.sh scripts/smoke-linux-package.sh packaging/postinstall.sh
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color

  powershell:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -RequiredVersion 1.23.0 -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path scripts/install.ps1 -Severity Warning,Error -ExcludeRule PSAvoidUsingWriteHost
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run test:ui
      - run: npm run build:ui
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: admin-ui
          path: packages/admin-ui/dist/

  test:
    needs: gate
    strategy:
      fail-fast: false
      matrix:
        # The arm64 Linux and Windows binaries are released too, so they are proven on native arm
        # runners, not only cross-compiled.
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm test
      - run: npm run test:runtime-compat
      - run: bun test test/runtime-compat
      - run: npm run build
      - run: npm run build:bin
      - run: npm run test:e2e
      - run: npm run test:installers
      # The web admin in headless Chromium: the binary rebuilt with the built SPA inside. Two runners cover
      # it; the admin is the same page on every OS and Playwright ships no browser for some of the others.
      - name: web e2e (Playwright)
        if: matrix.os == 'ubuntu-latest' || matrix.os == 'macos-15'
        run: |
          npm run build:ui
          npm run build:bin
          npx playwright install ${{ matrix.os == 'ubuntu-latest' && '--with-deps' || '' }} chromium
          npm run test:e2e:web
      # The real service manager: installs, crashes and removes a service. Linux and Windows must
      # recover the server after a crash. A launchd agent still depends on an interactive GUI session,
      # so the macOS runner reports that result without making it a gate.
      - name: e2e under the OS service manager
        run: npx vitest run --project e2e test/e2e/service.test.ts
        env:
          ATC_E2E_SERVICE: '1'
        continue-on-error: ${{ startsWith(matrix.os, 'macos') }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: atc-${{ matrix.os }}
          path: dist/bin/
