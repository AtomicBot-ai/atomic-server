name: release

# Publishes the `atc` binaries and the Linux packages. To release: `npm run release -- patch --push`
# (scripts/release.mjs bumps, commits, tags and pushes). The pushed `v*` tag runs this workflow:
#
#   gates → build (each target on its own runner, e2e on the very binary uploaded)
#         → sign-macos (Developer ID + notarisation), sign-windows (Authenticode) and packages (the deb
#           and rpm of the Linux binaries, nfpm; the rpm signed with the packages key)
#         → draft (SHA256SUMS over the signed binaries and the packages, provenance attestations, a draft)
#         → smoke (each runner installs the draft's assets with the installer and runs them) and
#           smoke-packages (each distro installs the packages the way README.md says, from a repository
#           of the draft served on loopback; Arch builds the AUR PKGBUILD)
#         → publish (the draft becomes the release; a version with "-" is a pre-release)
#         → linux-repo (linux-repo.yml: the apt/dnf repository and the AUR follow the published release;
#           a stable release from a tag only)
#
# A published version is never replaced: the updater and the installer pin checksums. A run by hand
# (workflow_dispatch) on a branch may set allow_unsigned for a dry run without the signing secrets; a
# tag never does.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      allow_unsigned:
        description: 'Dry run: build and publish a draft without signing secrets (never for a tag)'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  ATC_ALLOW_UNSIGNED: ${{ github.ref_type != 'tag' && inputs.allow_unsigned && '1' || '0' }}

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      publish_packages: ${{ steps.version.outputs.publish_packages }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Resolve the version and refuse one already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="v$version"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "$tag" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json $version"; exit 1
          fi
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::release $tag already exists"; exit 1
          fi
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          # The package repository and the AUR carry stable releases from a tag only (the environment
          # holding their credentials admits tags only). Job-level `if:` cannot read env, hence an output.
          publish_packages=false
          if [ "$prerelease" = false ] && [ "$GITHUB_REF_TYPE" = tag ]; then publish_packages=true; fi
          {
            echo "version=$version"; echo "tag=$tag"; echo "prerelease=$prerelease"
            echo "publish_packages=$publish_packages"
          } >> "$GITHUB_OUTPUT"

  gates:
    needs: version
    uses: ./.github/workflows/ci.yml

  build:
    needs: [version, gates]
    strategy:
      fail-fast: true
      matrix:
        include:
          - { runner: macos-15, targets: 'aarch64-apple-darwin x86_64-apple-darwin' }
          - {
              runner: ubuntu-latest,
              targets: 'x86_64-unknown-linux-gnu x86_64-unknown-linux-gnu-baseline x86_64-unknown-linux-musl',
            }
          - { runner: ubuntu-24.04-arm, targets: 'aarch64-unknown-linux-gnu aarch64-unknown-linux-musl' }
          - { runner: windows-2022, targets: 'x86_64-pc-windows-msvc x86_64-pc-windows-msvc-baseline' }
          - { runner: windows-11-arm, targets: 'aarch64-pc-windows-msvc' }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with: { bun-version: 1.3.10 }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - run: bun install --frozen-lockfile
      - run: npm run build:ui
      - run: npm run embed:ui
      - name: Build the binaries of this runner
        shell: bash
        env:
          # Bun before 1.4.2 cannot move a downloaded runtime across volumes (oven-sh/bun#43446); on
          # Windows runners the workspace is on D: and the default cache on C:, which breaks the baseline
          # target, the only one Bun downloads there. runner.temp shares the workspace's volume.
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-cache
          ATC_GIT_SHA: ${{ github.sha }}
          ATC_SENTRY_ENVIRONMENT: ${{ needs.version.outputs.prerelease == 'true' && 'prerelease' || 'production' }}
        run: |
          set -euo pipefail
          for triple in ${{ matrix.targets }}; do node scripts/build-binaries.mjs --target "$triple"; done
      # The e2e runs on this runner's native binary — the file uploaded below, not a rebuild.
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: built-${{ matrix.runner }}
          path: dist/bin/atc-*
          if-no-files-found: error

  # The deb and rpm of this run's Linux binaries: the very files `build` tested, no rebuild. The x64
  # packages carry the baseline build, since a package cannot pick by CPU.
  packages:
    needs: [version, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-ubuntu-latest, path: dist/bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-ubuntu-24.04-arm, path: dist/bin }
      - name: Install nfpm (pinned, checksum checked)
        env:
          NFPM_VERSION: 2.48.0
          NFPM_SHA256: 6d7f9a28b2f397934403950fcbba83f598b08d02edbe79a0815b3b4897341750
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nfpm.tar.gz"
          curl -fsSLo "$archive" \
            "https://github.com/goreleaser/nfpm/releases/download/v$NFPM_VERSION/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "$NFPM_SHA256  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" nfpm
          sudo install "$RUNNER_TEMP/nfpm" /usr/local/bin/nfpm
      # Artifacts lose the executable bit; the completions come from running the binary.
      - run: chmod +x dist/bin/atc-*
      - name: Import the packages key (must be packaging/atomic-chat.asc)
        if: env.ATC_ALLOW_UNSIGNED != '1'
        env:
          KEY: ${{ secrets.LINUX_PACKAGES_GPG_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "::error::the LINUX_PACKAGES_GPG_KEY secret is not set"; exit 1; fi
          file="$RUNNER_TEMP/packages-key.asc"
          (umask 077; printf '%s\n' "$KEY" > "$file")
          fpr() { gpg --show-keys --with-colons "$1" | awk -F: '/^fpr:/ {print $10; exit}'; }
          if [ "$(fpr "$file")" != "$(fpr packaging/atomic-chat.asc)" ]; then
            echo "::error::LINUX_PACKAGES_GPG_KEY is not the key in packaging/atomic-chat.asc"; exit 1
          fi
          echo "RPM_SIGNING_KEY_FILE=$file" >> "$GITHUB_ENV"
      - name: Build the packages
        env:
          NFPM_RPM_PASSPHRASE: ${{ secrets.LINUX_PACKAGES_GPG_PASSPHRASE }}
        run: node scripts/linux-packages.mjs build --version "$VERSION" --bin-dir dist/bin --out dist/pkg
      - name: Check the rpm signatures
        if: env.ATC_ALLOW_UNSIGNED != '1'
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq rpm >/dev/null
          db="$RUNNER_TEMP/rpmdb"
          mkdir -p "$db"
          rpmkeys --dbpath "$db" --import packaging/atomic-chat.asc
          for rpm in dist/pkg/*.rpm; do
            out="$(rpmkeys --dbpath "$db" --checksig "$rpm")"
            echo "$out"
            case "$out" in *'signatures OK'*) ;; *) echo "::error::$rpm is not signed by the packages key"; exit 1 ;; esac
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: packages
          path: dist/pkg/atc_*
          if-no-files-found: error

  sign-macos:
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-macos-15, path: dist/bin }
      - name: Write the notary API key
        env:
          NOTARYTOOL_KEY_CONTENT: ${{ secrets.NOTARYTOOL_KEY }}
        run: |
          set -euo pipefail
          if [ -n "$NOTARYTOOL_KEY_CONTENT" ]; then
            key="$RUNNER_TEMP/notary-key.p8"
            printf '%s' "$NOTARYTOOL_KEY_CONTENT" > "$key"; chmod 600 "$key"
            echo "NOTARYTOOL_KEY=$key" >> "$GITHUB_ENV"
          fi
      - name: Sign with the Developer ID
        env:
          MACOS_CSC_LINK: ${{ secrets.MACOS_CSC_LINK }}
          MACOS_CSC_KEY_PASSWORD: ${{ secrets.MACOS_CSC_KEY_PASSWORD }}
          MACOS_CSC_NAME: ${{ secrets.MACOS_CSC_NAME }}
        run: scripts/sign-mac-binary.sh dist/bin/atc-*-apple-darwin
      - name: Notarise
        env:
          NOTARYTOOL_KEY_ID: ${{ secrets.NOTARYTOOL_KEY_ID }}
          NOTARYTOOL_ISSUER: ${{ secrets.NOTARYTOOL_ISSUER }}
        run: scripts/notarize-mac-binary.sh dist/bin/atc-*-apple-darwin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-macos
          path: dist/bin/atc-*
          if-no-files-found: error

  sign-windows:
    needs: build
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-windows-2022, path: dist/bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-windows-11-arm, path: dist/bin }
      - name: Sign with Authenticode (DigiCert KeyLocker)
        shell: pwsh
        env:
          SM_API_KEY: ${{ secrets.SM_API_KEY }}
          SM_CLIENT_CERT_FILE_B64: ${{ secrets.SM_CLIENT_CERT_FILE_B64 }}
          SM_CLIENT_CERT_PASSWORD: ${{ secrets.SM_CLIENT_CERT_PASSWORD }}
          SM_CODE_SIGNING_CERT_SHA1_HASH: ${{ secrets.SM_CODE_SIGNING_CERT_SHA1_HASH }}
        run: ./scripts/sign-windows-binary.ps1 (Get-ChildItem dist/bin/atc-*.exe).FullName
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: signed-windows
          path: dist/bin/atc-*
          if-no-files-found: error

  draft:
    needs: [version, sign-macos, sign-windows, packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      TAG: ${{ needs.version.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: signed-macos, path: bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: signed-windows, path: bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-ubuntu-latest, path: bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: built-ubuntu-24.04-arm, path: bin }
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with: { name: packages, path: pkg }
      - name: Name the assets and checksum them, after signing
        run: |
          set -euo pipefail
          mkdir -p release
          for path in bin/atc-*; do
            name="$(basename "$path")"
            cp "$path" "release/atc-$VERSION-${name#atc-}"
          done
          expected="$(node --input-type=module -e "import { TARGETS } from './scripts/targets.mjs'; console.log(TARGETS.length)")"
          actual="$(find release -maxdepth 1 -name 'atc-*' | wc -l | tr -d ' ')"
          if [ "$actual" != "$expected" ]; then echo "::error::$actual binaries, expected $expected"; exit 1; fi
          # The packages are named atc_… (underscore): no atc-* glob above or in the installers sees them.
          cp pkg/atc_* release/
          node --input-type=module -e "
            import { existsSync } from 'node:fs'
            import { packageAssets } from './scripts/linux-packaging.mjs'
            const missing = packageAssets(process.env.VERSION).filter((f) => !existsSync('release/' + f))
            if (missing.length) { console.error('::error::missing packages: ' + missing.join(', ')); process.exit(1) }"
          cp scripts/install.sh scripts/install.ps1 LICENSE NOTICE THIRD_PARTY_NOTICES.md release/
          cd release
          # The license files too: the AUR PKGBUILD downloads them and pins their checksums.
          sha256sum atc-* atc_* install.sh install.ps1 LICENSE NOTICE THIRD_PARTY_NOTICES.md > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            release/atc-*
            release/atc_*
      - name: Create the draft release
        run: |
          set -euo pipefail
          flags=(--draft --title "$TAG" --generate-notes --target "$GITHUB_SHA")
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); fi
          if [ "$GITHUB_REF_TYPE" = tag ]; then flags+=(--verify-tag); fi
          gh release create "$TAG" release/* --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  smoke:
    needs: [version, draft]
    # A draft and its assets are visible only with write access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, ubuntu-latest, ubuntu-24.04-arm, windows-2022, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # A draft's assets are not public: fetch them, then serve them to the installer from loopback.
      - name: Fetch the draft's assets
        shell: bash
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl
      - name: Serve them on loopback
        shell: bash
        run: |
          py="$(command -v python3 || command -v python)"
          "$py" -m http.server 8765 --bind 127.0.0.1 --directory dl >/dev/null 2>&1 &
          sleep 2
      - name: Install with install.sh and run it
        if: runner.os != 'Windows'
        shell: bash
        env:
          ATC_DOWNLOAD_BASE: http://127.0.0.1:8765
          ATC_INSTALL_DIR: ${{ runner.temp }}/atc-bin
          ATC_NO_PATH: '1'
        run: |
          set -euo pipefail
          sh dl/install.sh
          atc="$ATC_INSTALL_DIR/atc"
          test "$("$atc" --version)" = "$VERSION"
          data="$RUNNER_TEMP/atc-data"
          "$atc" config set admin.port 0 --data-folder "$data"
          "$atc" start --no-admin --data-folder "$data"
          "$atc" status --json --data-folder "$data" | grep -q '"running": true'
          "$atc" stop --data-folder "$data"
      # No native runner for these: the musl builds in Alpine, the baseline build on this CPU. Bun's musl
      # builds link libstdc++ and libgcc dynamically, which a bare Alpine lacks.
      - name: Run the musl and baseline builds
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          arch="$(uname -m)"; [ "$arch" = arm64 ] && arch=aarch64
          chmod +x dl/atc-*
          docker run --rm -v "$PWD/dl:/dl:ro" -e BIN="/dl/atc-$VERSION-$arch-unknown-linux-musl" alpine:3.20 \
            sh -c 'apk add --no-cache -q libstdc++ libgcc && "$BIN" --version' | grep -qx "$VERSION"
          if [ "$arch" = x86_64 ]; then test "$("dl/atc-$VERSION-x86_64-unknown-linux-gnu-baseline" --version)" = "$VERSION"; fi
      - name: Check the macOS signatures (both architectures)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          for bin in dl/atc-*-apple-darwin; do
            chmod +x "$bin"
            codesign --verify --strict --verbose=2 "$bin"
            if [ "$ATC_ALLOW_UNSIGNED" != 1 ]; then
              codesign -dv "$bin" 2>&1 | grep -q '^TeamIdentifier=[A-Z0-9]\{10\}$'
              spctl --assess --type execute --verbose "$bin"
            fi
          done
          # The Intel build, under Rosetta.
          test "$(arch -x86_64 dl/atc-*-x86_64-apple-darwin --version 2>/dev/null)" = "$VERSION"
      - name: Install with install.ps1, run it, check the signatures
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          ATC_DOWNLOAD_BASE: http://127.0.0.1:8765
          ATC_INSTALL_DIR: ${{ runner.temp }}\atc-bin
          ATC_NO_PATH: '1'
        run: |
          $ErrorActionPreference = "Stop"
          ./dl/install.ps1
          $atc = Join-Path $env:ATC_INSTALL_DIR "atc.exe"
          if ((& $atc --version) -ne $env:VERSION) { throw "atc --version is not $env:VERSION" }
          $data = Join-Path $env:RUNNER_TEMP "atc-data"
          & $atc config set admin.port 0 --data-folder $data; if ($LASTEXITCODE) { throw "config" }
          & $atc start --no-admin --data-folder $data; if ($LASTEXITCODE) { throw "start" }
          & $atc stop --data-folder $data; if ($LASTEXITCODE) { throw "stop" }
          if ($env:ATC_ALLOW_UNSIGNED -ne "1") {
            foreach ($exe in Get-ChildItem dl/atc-*.exe) {
              $status = (Get-AuthenticodeSignature -LiteralPath $exe.FullName).Status
              if ($status -ne "Valid") { throw "$($exe.Name): Authenticode status $status" }
            }
          }

  # Each package of the draft, installed the way README.md says in a clean container of the distro: apt
  # and dnf from a repository of the draft served on loopback (its metadata signed with a throwaway key;
  # the rpm signatures checked against packaging/atomic-chat.asc), Arch by building the AUR PKGBUILD
  # against the draft's files. scripts/smoke-linux-package.sh holds the checks.
  smoke-packages:
    needs: [version, draft]
    # A draft and its assets are visible only with write access.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: ubuntu-latest, image: 'debian:12', manager: apt }
          - { runner: ubuntu-latest, image: 'ubuntu:24.04', manager: apt }
          - { runner: ubuntu-latest, image: 'fedora:44', manager: dnf }
          - { runner: ubuntu-latest, image: 'rockylinux/rockylinux:9', manager: dnf }
          - { runner: ubuntu-latest, image: 'archlinux:latest', manager: pacman }
          - { runner: ubuntu-24.04-arm, image: 'debian:12', manager: apt }
          - { runner: ubuntu-24.04-arm, image: 'fedora:44', manager: dnf }
    runs-on: ${{ matrix.runner }}
    env:
      TAG: ${{ needs.version.outputs.tag }}
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      IMAGE: ${{ matrix.image }}
      MANAGER: ${{ matrix.manager }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22 }
      - name: Fetch the draft's assets
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dl
      - name: Serve a repository of the draft's packages on loopback
        if: matrix.manager != 'pacman'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq dpkg-dev apt-utils createrepo-c >/dev/null
          gpg --batch --passphrase '' --quick-gen-key 'atc smoke <smoke@invalid>' rsa3072 sign 1d
          fpr() { gpg --show-keys --with-colons "$1" | awk -F: '/^fpr:/ {print $10; exit}'; }
          smoke="$(gpg --list-keys --with-colons smoke@invalid | awk -F: '/^fpr:/ {print $10; exit}')"
          keys="$smoke"
          flags=()
          if [ "$ATC_ALLOW_UNSIGNED" = 1 ]; then
            flags+=(--unsigned-packages)
          else
            gpg --batch --import packaging/atomic-chat.asc
            keys="$keys,$(fpr packaging/atomic-chat.asc)"
          fi
          node scripts/linux-repo.mjs build --assets dl --key "$smoke" --publish-keys "$keys" --out site \
            --base-url http://127.0.0.1:8766 "${flags[@]}"
          node scripts/linux-repo.mjs readme --block "$MANAGER" --base-url http://127.0.0.1:8766 > install-commands.sh
          python3 -m http.server 8766 --bind 127.0.0.1 --directory site >/dev/null 2>&1 &
          sleep 2
      - name: Render the AUR PKGBUILD against the draft's files
        if: matrix.manager == 'pacman'
        run: node scripts/linux-packages.mjs pkgbuild --version "$VERSION" --sums dl/SHA256SUMS --source-base file:///w/dl --out aur
      - name: Install and check in the container
        run: |
          set -euo pipefail
          input=/w/install-commands.sh
          if [ "$MANAGER" = pacman ]; then input=/w/aur; fi
          docker run --rm --network host -v "$PWD:/w:ro" "$IMAGE" sh /w/scripts/smoke-linux-package.sh "$MANAGER" "$VERSION" "$input"

  publish:
    needs: [version, smoke, smoke-packages]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Publish the draft
        run: |
          set -euo pipefail
          if [ "$ATC_ALLOW_UNSIGNED" = 1 ]; then
            echo "dry run (allow_unsigned): the draft stays a draft"; exit 0
          fi
          flags=(--draft=false)
          if [ "${{ needs.version.outputs.prerelease }}" = true ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release edit "${{ needs.version.outputs.tag }}" --repo "$GITHUB_REPOSITORY" "${flags[@]}"

  # The apt/dnf repository and the AUR follow a published release: .github/workflows/linux-repo.yml.
  # It is called from here because a release published with GITHUB_TOKEN starts no `release: published`
  # workflow; a release published by a person does, and runs linux-repo.yml on its own.
  linux-repo:
    needs: [version, publish]
    if: needs.version.outputs.publish_packages == 'true'
    uses: ./.github/workflows/linux-repo.yml
    with:
      tag: ${{ needs.version.outputs.tag }}
    secrets: inherit
